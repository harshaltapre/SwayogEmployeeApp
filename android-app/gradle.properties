# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m
kotlin.incremental=false
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
android.nonTransitiveRClass=false
kotlin.plugin.statistics.enabled=false
# Compatibility mode for R8: prevents stripping of Kotlin coroutine Continuation generic signatures needed by Retrofit
android.enableR8.fullMode=false
# org.gradle.java.home is not set here to allow CI/CD environments to use their configured Java
# Local development can configure Java through Android Studio settings

# API Configuration
API_BASE_URL=https://swayog-dashboard.vercel.app/api/v1/
WS_BASE_URL=wss://swayog-dashboard.vercel.app

# Windows-specific fixes for KSP/Hilt directory creation issues
ksp.incremental=false
ksp.incremental.intermodule=false
hilt.enableAggregatingTask=true
hilt.enableKsp=true

# Enable features for better performance and stability
# Disabled vfs.watch on Windows to prevent file locking on build/intermediates/classes
org.gradle.vfs.watch=false
org.gradle.configuration-cache=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# Prevent AGP from marking generated APKs as testOnly=true (which blocks WhatsApp/sideload installation)
android.injected.testOnly=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
