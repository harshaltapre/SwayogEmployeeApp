name: Production Android APK Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_name:
        description: Version name (for example 1.0.1)
        required: false
        default: '1.0.1'
      version_code:
        description: Version code or build number (for example 21)
        required: false
        default: '21'
      minimum_version_code:
        description: Minimum supported version code
        required: false
        default: '1'
      mandatory:
        description: Mandatory update?
        required: false
        type: boolean
        default: false
      release_notes:
        description: Release notes shown in the update dialog
        required: false
        default: |
          Attendance and synchronization improvements
          Improved attendance tracking
          Fixed working-hour calculation
          Improved profile synchronization
          Bug fixes and performance improvements

permissions:
  contents: read

concurrency:
  group: android-production-release
  cancel-in-progress: false

env:
  APP_ID: com.swayog.employee
  APP_PACKAGE: com.swayog.employee
  GOOGLE_SERVICES_JSON_PATH: android-app/app/google-services.json
  KEYSTORE_PATH: android-app/keystore/release.jks
  RELEASE_APK_PATH: android-app/app/build/outputs/apk/release/app-release.apk
  MINIMUM_VERSION_BASELINE: '20'

jobs:
  production-release:
    name: Build and publish signed production APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            for candidate in /usr/local/lib/android/sdk /opt/android-sdk /usr/lib/android-sdk; do
              if [ -d "$candidate" ]; then
                SDK_ROOT="$candidate"
                break
              fi
            done
          fi

          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "::error::FAILED STAGE: Android SDK setup"
            echo "::error::Android SDK was not found on the runner."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo "Android SDK verified at $SDK_ROOT"
          ls -1 "$SDK_ROOT" | head

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Determine production version
        id: versioning
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_NAME="${{ github.event.inputs.version_name }}"
            VERSION_CODE="${{ github.event.inputs.version_code }}"
            MIN_VERSION_CODE="${{ github.event.inputs.minimum_version_code }}"
            MANDATORY="${{ github.event.inputs.mandatory }}"
          else
            git fetch --tags --force >/dev/null 2>&1 || true

            HIGHEST_CODE=20
            LATEST_VERSION_NAME="1.0.0"
            while read -r tag; do
              if [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)-build([0-9]+)$ ]]; then
                code=${BASH_REMATCH[4]}
                version_name="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
                if (( code > HIGHEST_CODE )); then
                  HIGHEST_CODE=$code
                  LATEST_VERSION_NAME="$version_name"
                fi
              fi
            done < <(git tag -l 'v*-build*')

            VERSION_CODE=$((HIGHEST_CODE + 1))
            VERSION_NAME="$LATEST_VERSION_NAME"
            MIN_VERSION_CODE="1"
            MANDATORY="false"
          fi

          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::FAILED STAGE: Versioning"
            echo "::error::Version code must be numeric; got '${VERSION_CODE}'."
            exit 1
          fi

          if (( VERSION_CODE <= MINIMUM_VERSION_BASELINE )); then
            echo "::error::FAILED STAGE: Versioning"
            echo "::error::versionCode must be greater than ${MINIMUM_VERSION_BASELINE}; got '${VERSION_CODE}'."
            exit 1
          fi

          if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::FAILED STAGE: Versioning"
            echo "::error::versionName must be semantic version text; got '${VERSION_NAME}'."
            exit 1
          fi

          if ! [[ "$MIN_VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::FAILED STAGE: Versioning"
            echo "::error::minimum_version_code must be numeric; got '${MIN_VERSION_CODE}'."
            exit 1
          fi

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "MIN_VERSION_CODE=$MIN_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "MANDATORY=$MANDATORY" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=v${VERSION_NAME}-build${VERSION_CODE}" >> "$GITHUB_OUTPUT"

          echo "Selected release versionName=${VERSION_NAME}, versionCode=${VERSION_CODE}, minimumVersionCode=${MIN_VERSION_CODE}, mandatory=${MANDATORY}"

      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "::error::FAILED STAGE: Firebase configuration"
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 GitHub Secret is missing."
            exit 1
          fi

          mkdir -p "$(dirname "$GOOGLE_SERVICES_JSON_PATH")"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n[:space:]' | base64 -d > "$GOOGLE_SERVICES_JSON_PATH"

          if [ ! -s "$GOOGLE_SERVICES_JSON_PATH" ]; then
            echo "::error::FAILED STAGE: Firebase configuration"
            echo "::error::google-services.json is empty or was not restored."
            exit 1
          fi

          python - <<'PY'
          import json, os
          path = os.environ['GOOGLE_SERVICES_JSON_PATH']
          try:
              with open(path, 'r', encoding='utf-8') as fh:
                  data = json.load(fh)
          except Exception as exc:
              print("::error::FAILED STAGE: Firebase configuration")
              print(f"::error::google-services.json is not valid JSON: {exc}")
              raise SystemExit(1)

          clients = data.get('client')
          if not isinstance(clients, list) or not clients:
              print("::error::FAILED STAGE: Firebase configuration")
              print("::error::google-services.json structure is invalid: missing client list.")
              raise SystemExit(1)

          pkg = None
          first = clients[0]
          if isinstance(first, dict):
              pkg = first.get('client_info', {}).get('android_client_info', {}).get('package_name')

          expected = os.environ['APP_ID']
          if pkg != expected:
              print("::error::FAILED STAGE: Firebase configuration")
              print(f"::error::google-services.json package name mismatch: found '{pkg}', expected '{expected}'.")
              raise SystemExit(1)

          print(f"Firebase configuration restored for {pkg}.")
          PY

      - name: Restore production keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::FAILED STAGE: Signing"
            echo "::error::Missing production keystore secrets. Required: KEYSTORE_B64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD."
            exit 1
          fi

          mkdir -p "$(dirname "$KEYSTORE_PATH")"
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n[:space:]' | base64 -d > "$KEYSTORE_PATH"

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::FAILED STAGE: Signing"
            echo "::error::Keystore decode produced an empty file."
            exit 1
          fi

          keytool -list -v -keystore "$KEYSTORE_PATH" -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" >/dev/null

          echo "RELEASE_STORE_FILE=$GITHUB_WORKSPACE/$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android-app
        env:
          RELEASE_STORE_FILE: ${{ env.RELEASE_STORE_FILE }}
          RELEASE_KEY_ALIAS: ${{ env.RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ env.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ env.RELEASE_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.versioning.outputs.VERSION_NAME }}
          VERSION_CODE: ${{ steps.versioning.outputs.VERSION_CODE }}
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x gradlew

          if [ -z "${RELEASE_STORE_FILE:-}" ]; then
            echo "::error::FAILED STAGE: Signing"
            echo "::error::RELEASE_STORE_FILE is not set before the Gradle build."
            exit 1
          fi

          ./gradlew :app:assembleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE" \
            -PRELEASE_STORE_FILE="$RELEASE_STORE_FILE" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD" \
            --no-daemon --stacktrace

      - name: Validate APK identity and signature
        env:
          EXPECTED_VERSION_NAME: ${{ steps.versioning.outputs.VERSION_NAME }}
          EXPECTED_VERSION_CODE: ${{ steps.versioning.outputs.VERSION_CODE }}
          EXPECTED_CERT_SHA256: ${{ secrets.PRODUCTION_CERT_SHA256 }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ ! -f "$RELEASE_APK_PATH" ]; then
            echo "::error::FAILED STAGE: APK validation"
            echo "::error::Release APK was not produced at $RELEASE_APK_PATH."
            exit 1
          fi

          AAPT2="$(command -v aapt2 || true)"
          APKSIGNER="$(command -v apksigner || true)"
          if [ -z "$AAPT2" ] && [ -n "$ANDROID_HOME" ]; then
            AAPT2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)"
          fi
          if [ -z "$APKSIGNER" ] && [ -n "$ANDROID_HOME" ]; then
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          fi

          if [ -z "$AAPT2" ] || [ -z "$APKSIGNER" ]; then
            echo "::error::FAILED STAGE: APK validation"
            echo "::error::Android build-tools aapt2/apksigner were not found."
            exit 1
          fi

          if ! "$APKSIGNER" verify --print-certs "$RELEASE_APK_PATH" >/tmp/apk-certs.txt 2>&1; then
            echo "::error::FAILED STAGE: APK validation"
            echo "::error::APK signature validation failed."
            cat /tmp/apk-certs.txt || true
            exit 1
          fi

          CERT_TEXT="$(cat /tmp/apk-certs.txt)"
          if echo "$CERT_TEXT" | grep -qi 'CN=Android Debug'; then
            echo "::error::FAILED STAGE: Signing"
            echo "::error::APK is signed with the Android debug certificate and cannot be published as a production update."
            exit 1
          fi

          if [ -z "${EXPECTED_CERT_SHA256:-}" ]; then
            echo "::error::FAILED STAGE: Signing"
            echo "::error::PRODUCTION_CERT_SHA256 is missing. Refusing to publish a release without certificate validation."
            exit 1
          fi

          EXPECTED_CLEAN="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          ACTUAL_CLEAN="$(printf '%s' "$CERT_TEXT" | grep -i 'SHA-256 digest' | head -n 1 | awk '{print $NF}' | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$ACTUAL_CLEAN" ] || [ "$ACTUAL_CLEAN" != "$EXPECTED_CLEAN" ]; then
            echo "::error::FAILED STAGE: Signing"
            echo "::error::Signing certificate mismatch: expected '$EXPECTED_CLEAN' but APK reports '$ACTUAL_CLEAN'."
            exit 1
          fi

          BADGING="$($AAPT2 dump badging "$RELEASE_APK_PATH")"
          if ! echo "$BADGING" | grep -q "package: name='${APP_PACKAGE}'"; then
            echo "::error::FAILED STAGE: APK validation"
            echo "::error::APK package name is not ${APP_PACKAGE}."
            exit 1
          fi
          if ! echo "$BADGING" | grep -q "versionCode='${EXPECTED_VERSION_CODE}'"; then
            echo "::error::FAILED STAGE: APK validation"
            echo "::error::APK versionCode mismatch; expected ${EXPECTED_VERSION_CODE}."
            exit 1
          fi
          if ! echo "$BADGING" | grep -q "versionName='${EXPECTED_VERSION_NAME}'"; then
            echo "::error::FAILED STAGE: APK validation"
            echo "::error::APK versionName mismatch; expected ${EXPECTED_VERSION_NAME}."
            exit 1
          fi

          if ! unzip -l "$RELEASE_APK_PATH" | grep -q 'META-INF/MANIFEST.MF'; then
            echo "::error::FAILED STAGE: APK validation"
            echo "::error::APK is missing META-INF/MANIFEST.MF and is not a valid release package."
            exit 1
          fi

          SHA256="$(sha256sum "$RELEASE_APK_PATH" | awk '{print $1}')"
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "APK_SHA256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "Verified production APK: ${RELEASE_APK_PATH}"
          echo "Signing certificate matches the production key: ${ACTUAL_CLEAN}"

      - name: Prepare release notes
        shell: bash
        run: |
          cat <<'EOF' > release_notes.txt
          ${{ github.event.inputs.release_notes || 'Attendance and synchronization improvements
          • Improved attendance tracking
          • Fixed working-hour calculation
          • Improved attendance calendar
          • Improved profile synchronization
          • Bug fixes and performance improvements' }}
          EOF

      - name: Publish to Cloudflare R2 and latest.json
        working-directory: backend
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL || secrets.PUBLIC_DISTRIBUTION_URL }}
          PUBLIC_DISTRIBUTION_URL: ${{ secrets.R2_PUBLIC_URL || secrets.PUBLIC_DISTRIBUTION_URL }}
          VERSION_NAME: ${{ steps.versioning.outputs.VERSION_NAME }}
          VERSION_CODE: ${{ steps.versioning.outputs.VERSION_CODE }}
          MIN_VERSION_CODE: ${{ steps.versioning.outputs.MIN_VERSION_CODE }}
          MANDATORY: ${{ steps.versioning.outputs.MANDATORY }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ -z "${R2_ACCESS_KEY_ID:-}" ] || [ -z "${R2_SECRET_ACCESS_KEY:-}" ] || [ -z "${R2_BUCKET_NAME:-}" ] || [ -z "${R2_ENDPOINT:-}" ] || [ -z "${R2_PUBLIC_URL:-}" ]; then
            echo "::error::FAILED STAGE: R2 upload"
            echo "::error::Cloudflare R2 secrets are incomplete. Required: R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME, R2_ENDPOINT, R2_PUBLIC_URL."
            exit 1
          fi

          npm ci --no-audit --no-fund

          npx tsx scripts/deploy-release.ts \
            "../${RELEASE_APK_PATH}" \
            "$VERSION_NAME" \
            "$VERSION_CODE" \
            "$MIN_VERSION_CODE" \
            "$MANDATORY" \
            "../release_notes.txt" \
            "v${VERSION_NAME}-build${VERSION_CODE}" \
            "Swayog Employee App v${VERSION_NAME} — Build ${VERSION_CODE}"

      - name: Verify public manifest endpoint
        env:
          PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL || secrets.PUBLIC_DISTRIBUTION_URL }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ -z "${PUBLIC_URL:-}" ]; then
            echo "::error::FAILED STAGE: Metadata"
            echo "::error::R2_PUBLIC_URL is not configured. The app cannot fetch latest.json."
            exit 1
          fi

          STATUS="$(curl -sS -o /tmp/latest.json -w '%{http_code}' "${PUBLIC_URL%/}/latest.json")" || {
            echo "::error::FAILED STAGE: Metadata"
            echo "::error::Public manifest endpoint is unavailable."
            exit 1
          }

          if [ "$STATUS" != "200" ]; then
            echo "::error::FAILED STAGE: Metadata"
            echo "::error::latest.json returned HTTP ${STATUS} from ${PUBLIC_URL%/}/latest.json"
            exit 1
          fi

          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/latest.json', 'utf8'));
          if (data.appId !== 'com.swayog.employee') throw new Error('appId mismatch');
          if (data.platform !== 'android') throw new Error('platform mismatch');
          if (!data.apkUrl || !String(data.apkUrl).startsWith('https://')) throw new Error('apkUrl must use https');
          if (!/^[a-fA-F0-9]{64}$/.test(String(data.sha256 || ''))) throw new Error('sha256 must be 64 hex chars');
          console.log(`Verified full release metadata for ${data.versionName} build ${data.versionCode}.`);
          NODE

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f "$GOOGLE_SERVICES_JSON_PATH" "$KEYSTORE_PATH"

      - name: Release summary
        shell: bash
        run: |
          set -Eeuo pipefail
          APK_SIZE="$(stat -c%s "$RELEASE_APK_PATH")"
          APK_SHA="$(sha256sum "$RELEASE_APK_PATH" | awk '{print $1}')"
          echo "========================================"
          echo "SWAYOG EMPLOYEE RELEASE"
          echo "========================================"
          echo "Application ID: com.swayog.employee"
          echo "Version Name: ${{ steps.versioning.outputs.VERSION_NAME }}"
          echo "Version Code: ${{ steps.versioning.outputs.VERSION_CODE }}"
          echo "APK: app-release.apk"
          echo "APK Size: ${APK_SIZE} bytes"
          echo "SHA-256: ${APK_SHA}"
          echo "Signing Certificate: validated against PRODUCTION_CERT_SHA256"
          echo "R2 Upload: SUCCESS"
          echo "Metadata: SUCCESS"
          echo "GitHub Release: SKIPPED"
          echo "========================================"
