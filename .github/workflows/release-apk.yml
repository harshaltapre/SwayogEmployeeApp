name: Build and Deploy Android Release APK

on:
  push:
    branches:
      - main
    paths:
      - 'android-app/**'
      - '.github/workflows/release-apk.yml'
      - 'backend/scripts/deploy-release.ts'
      - 'web-update/**'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name override (optional, e.g. 1.1.0 - leave blank to auto-calculate)'
        required: false
        default: ''
      version_code:
        description: 'Version Code / Build Number override (optional, numeric - leave blank to auto-calculate)'
        required: false
        default: ''
      minimum_version_code:
        description: 'Minimum Supported Version Code (numeric, e.g. 1)'
        required: false
        default: '1'
      mandatory:
        description: 'Is this a mandatory update?'
        type: boolean
        default: false
      release_notes:
        description: 'User-facing release notes override (optional - leave blank to auto-generate from commits)'
        required: false
        default: ''

concurrency:
  group: release-apk-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build-and-deploy:
    name: Build Signed Release APK & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          accept-android-sdk-licenses: 'false'

      - name: Validate Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "========================================"
          echo "STAGE: Android SDK"
          echo "========================================"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::FAILED STAGE: Android SDK"
            echo "::error::ANDROID_SDK_ROOT and ANDROID_HOME are both unset."
            exit 1
          fi
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_HOME="$SDK_ROOT"
          echo "Java version:"
          java -version 2>&1
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "sdkmanager version:"
          sdkmanager --version

          echo "========================================"
          echo "STAGE: Android SDK License Acceptance"
          echo "========================================"
          set +e
          set +o pipefail
          yes | sdkmanager --licenses >/tmp/sdkmanager-licenses.log 2>&1
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -e
          set -o pipefail
          if [ "$LICENSE_STATUS" -ne 0 ]; then
            cat /tmp/sdkmanager-licenses.log
            echo "::error::FAILED STAGE: Android SDK"
            echo "::error::Android SDK licenses could not be accepted non-interactively."
            exit "$LICENSE_STATUS"
          fi

          if ! sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"; then
            echo "::error::FAILED STAGE: Android SDK"
            echo "::error::Required Android SDK packages could not be installed."
            exit 1
          fi

          echo "========================================"
          echo "STAGE: Android SDK Validation"
          echo "========================================"
          if ! sdkmanager --list >/dev/null; then
            echo "::error::FAILED STAGE: Android SDK"
            echo "::error::sdkmanager could not list installed packages."
            exit 1
          fi
          echo "Installed required SDK packages:"
          sdkmanager --list | grep -E 'platform-tools|platforms;android-34|build-tools;34\.0\.0'
          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-34" ]; then
            echo "::error::FAILED STAGE: Android SDK"
            echo "::error::Required platform android-34 is missing."
            exit 1
          fi
          if [ ! -d "$ANDROID_SDK_ROOT/build-tools/34.0.0" ]; then
            echo "::error::FAILED STAGE: Android SDK"
            echo "::error::Required build-tools 34.0.0 are missing."
            exit 1
          fi
          echo "Android SDK setup completed successfully."

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Tooling Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Semantic Versioning Verification Tests
        working-directory: backend
        run: npx tsx scripts/test-versioning-rules.ts

      - name: Determine Next Semantic Version & Build Number
        id: versioning
        working-directory: backend
        env:
          INPUT_VERSION_NAME: ${{ github.event.inputs.version_name }}
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code }}
          INPUT_RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
          MIN_VERSION_CODE: ${{ github.event.inputs.minimum_version_code || '1' }}
          MANDATORY: ${{ github.event.inputs.mandatory || 'false' }}
        run: |
          set -Eeuo pipefail
          echo "========================================"
          echo "STAGE: Automatic Semantic Versioning"
          echo "========================================"

          # Fetch all tags from origin
          git fetch --tags --force origin 2>/dev/null || true

          # Execute automatic semantic versioning engine
          npx tsx scripts/calculate-version.ts "$INPUT_VERSION_NAME" "$INPUT_VERSION_CODE" "$INPUT_RELEASE_NOTES" "$GITHUB_WORKSPACE/release_notes.txt"

          echo "MIN_VERSION_CODE=$MIN_VERSION_CODE" >> $GITHUB_OUTPUT
          echo "MANDATORY=$MANDATORY" >> $GITHUB_OUTPUT


      - name: Restore and Validate Production Signing Key
        id: signing_secrets
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          EXPECTED_REPO_CERT_SHA256: ${{ vars.PRODUCTION_CERT_SHA256 }}
        run: |
          set -o pipefail

          echo "========================================"
          echo "STAGE: Production Signing"
          echo "========================================"
          [ -n "${KEYSTORE_B64:-}" ] && echo "KEYSTORE_B64: PRESENT" || echo "KEYSTORE_B64: MISSING"
          [ -n "${KEYSTORE_PASSWORD:-}" ] && echo "KEYSTORE_PASSWORD: PRESENT" || echo "KEYSTORE_PASSWORD: MISSING"
          [ -n "${KEY_ALIAS:-}" ] && echo "KEY_ALIAS: PRESENT" || echo "KEY_ALIAS: MISSING"
          [ -n "${KEY_PASSWORD:-}" ] && echo "KEY_PASSWORD: PRESENT" || echo "KEY_PASSWORD: MISSING"

          for secret_name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::$secret_name is missing or empty"
              exit 1
            fi
          done

          mkdir -p android-app/keystore
          if ! printf '%s' "$KEYSTORE_B64" \
            | tr -d '\r\n[:space:]' \
            | base64 --decode > android-app/keystore/release.jks; then
            echo "::error::FAILED STAGE: Base64 decode"
            echo "::error::KEYSTORE_B64 could not be decoded as base64."
            exit 1
          fi

          if [ ! -s android-app/keystore/release.jks ]; then
            echo "::error::Decoded keystore is empty"
            exit 1
          fi

          KEYSTORE_SIZE=$(stat -c%s android-app/keystore/release.jks)
          KEYSTORE_SHA256=$(sha256sum android-app/keystore/release.jks | awk '{print $1}')
          KEYSTORE_HEX_HEADER=$(head -c 16 android-app/keystore/release.jks | od -tx1 -An | tr -d ' \n')
          echo "Decoded Keystore size:        ${KEYSTORE_SIZE} bytes"
          echo "Decoded Keystore file SHA256: ${KEYSTORE_SHA256}"
          echo "Decoded Keystore header hex:   ${KEYSTORE_HEX_HEADER}"

          echo "========================================"
          echo "SAFE KEYSTORE DIAGNOSTICS"
          echo "========================================"
          echo "1. File utility inspection:"
          file android-app/keystore/release.jks || true

          echo "2. OpenSSL ASN.1 DER structure (first 30 lines):"
          openssl asn1parse -inform DER -in android-app/keystore/release.jks 2>&1 | head -n 30 || true

          echo "3. OpenSSL PKCS12 inspection:"
          openssl pkcs12 -info -in android-app/keystore/release.jks -noout -passin env:KEYSTORE_PASSWORD 2>&1 || true

          echo "4. OpenSSL X.509 DER Certificate inspection:"
          openssl x509 -inform DER -in android-app/keystore/release.jks -noout -subject -issuer -fingerprint -sha256 2>&1 || true

          echo "5. Keytool storetype JKS inspection:"
          keytool -list -storetype JKS -keystore android-app/keystore/release.jks -storepass "$KEYSTORE_PASSWORD" 2>&1 | head -n 15 || true

          echo "6. Keytool storetype PKCS12 inspection:"
          keytool -list -storetype PKCS12 -keystore android-app/keystore/release.jks -storepass "$KEYSTORE_PASSWORD" 2>&1 | head -n 15 || true
          echo "========================================"

          KEYTOOL_OUTPUT=$(mktemp)
          KEYTOOL_ERROR=$(mktemp)
          if ! keytool -list \
            -keystore android-app/keystore/release.jks \
            -storepass "$KEYSTORE_PASSWORD" >"$KEYTOOL_OUTPUT" 2>"$KEYTOOL_ERROR"; then
            cat "$KEYTOOL_ERROR"
            if grep -Eqi 'password was incorrect|tampered with, or password incorrect' "$KEYTOOL_ERROR"; then
              echo "::error::FAILED STAGE: Keystore password"
              echo "::error::KEYSTORE_PASSWORD could not open the decoded keystore."
            else
              echo "::error::FAILED STAGE: Keystore validation"
              echo "::error::The decoded file is not a valid JKS/PKCS12 keystore."
            fi
            rm -f "$KEYTOOL_OUTPUT" "$KEYTOOL_ERROR"
            exit 1
          fi
          KEYSTORE_PASSWORD=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')
          KEY_PASSWORD=$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')
          KEY_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n[:space:]')

          HEADER_4B=$(head -c 4 android-app/keystore/release.jks | od -tx1 -An | tr -d ' \n')
          if [ "$HEADER_4B" = "3082" ] || [ "${HEADER_4B:0:4}" = "3082" ]; then
            KEYSTORE_FORMAT="PKCS12"
          elif [ "$HEADER_4B" = "feedfeed" ]; then
            KEYSTORE_FORMAT="JKS"
          elif keytool -list -storetype PKCS12 \
            -keystore android-app/keystore/release.jks \
            -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            KEYSTORE_FORMAT="PKCS12"
          elif keytool -list -storetype JKS \
            -keystore android-app/keystore/release.jks \
            -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            KEYSTORE_FORMAT="JKS"
          else
            echo "::error::FAILED STAGE: Keystore validation"
            echo "::error::The keystore format could not be identified as JKS or PKCS12."
            rm -f "$KEYTOOL_OUTPUT"
            exit 1
          fi

          if ! keytool -list \
            -keystore android-app/keystore/release.jks \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::FAILED STAGE: Key alias"
            echo "::error::The configured KEY_ALIAS does not exist in the production keystore."
            rm -f "$KEYTOOL_OUTPUT"
            exit 1
          fi

          KEY_PASSWORD_CHECK=$(mktemp)
          if ! keytool -certreq \
            -keystore android-app/keystore/release.jks \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -file "$KEY_PASSWORD_CHECK" >/dev/null 2>&1; then
            echo "::error::FAILED STAGE: Key password"
            echo "::error::KEY_PASSWORD cannot access the configured alias private key."
            rm -f "$KEYTOOL_OUTPUT" "$KEY_PASSWORD_CHECK"
            exit 1
          fi
          rm -f "$KEY_PASSWORD_CHECK"

          CERT_OUTPUT=$(mktemp)
          if ! keytool -list -v \
            -keystore android-app/keystore/release.jks \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" >"$CERT_OUTPUT"; then
            echo "::error::FAILED STAGE: Production certificate extraction"
            rm -f "$KEYTOOL_OUTPUT" "$CERT_OUTPUT"
            exit 1
          fi
          PRODUCTION_CERT_SHA256=$(awk -F': ' '/SHA256:/{print $2; exit}' "$CERT_OUTPUT")
          rm -f "$KEYTOOL_OUTPUT" "$CERT_OUTPUT"
          if [ -z "$PRODUCTION_CERT_SHA256" ]; then
            echo "::error::FAILED STAGE: Production certificate extraction"
            echo "::error::The production certificate SHA-256 fingerprint could not be extracted."
            exit 1
          fi

          if [ -n "${EXPECTED_REPO_CERT_SHA256:-}" ]; then
            CLEAN_REPO_CERT=$(echo "$EXPECTED_REPO_CERT_SHA256" | tr -d ': ' | tr '[:upper:]' '[:lower:]')
            CLEAN_KEYSTORE_CERT=$(echo "$PRODUCTION_CERT_SHA256" | tr -d ': ' | tr '[:upper:]' '[:lower:]')
            echo "Repository variable PRODUCTION_CERT_SHA256: $CLEAN_REPO_CERT"
            echo "Decoded Keystore certificate SHA-256:       $CLEAN_KEYSTORE_CERT"
            if [ "$CLEAN_KEYSTORE_CERT" != "$CLEAN_REPO_CERT" ]; then
              echo "::error::CRITICAL: Keystore signing certificate ($CLEAN_KEYSTORE_CERT) does not match repository variable PRODUCTION_CERT_SHA256 ($CLEAN_REPO_CERT)!"
              exit 1
            fi
            echo "✅ Keystore certificate matches repository variable PRODUCTION_CERT_SHA256."
          fi

          echo "========================================"
          echo "SIGNING VALIDATION"
          echo "========================================"
          echo "Keystore: FOUND"
          echo "Keystore size: ${KEYSTORE_SIZE} bytes"
          echo "Keystore format: $KEYSTORE_FORMAT"
          echo "Alias: FOUND"
          echo "Keystore password: VALID"
          echo "Key password: VALID"
          echo "Production signing certificate SHA-256: $PRODUCTION_CERT_SHA256"
          echo "========================================"
          echo "SIGNING VALIDATION PASSED"
          echo "========================================"
          echo "PRODUCTION_CERT_SHA256=$PRODUCTION_CERT_SHA256" >> "$GITHUB_OUTPUT"
          echo "KEYSTORE_FORMAT=$KEYSTORE_FORMAT" >> "$GITHUB_OUTPUT"

      - name: Make Gradlew Executable
        run: chmod +x android-app/gradlew

      - name: Build and Sign Release APK
        working-directory: android-app
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/android-app/keystore/release.jks
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_TYPE: ${{ steps.signing_secrets.outputs.KEYSTORE_FORMAT }}
          API_BASE_URL: ${{ secrets.API_BASE_URL || 'https://swayog-dashboard.vercel.app/api/v1/' }}
          WS_BASE_URL: ${{ secrets.WS_BASE_URL || 'wss://swayog-dashboard.vercel.app' }}
          RAW_DIST_URL: ${{ secrets.PUBLIC_DISTRIBUTION_URL || 'https://swayog-dashboard.vercel.app' }}
        run: |
          set -Eeuo pipefail
          echo "========================================"
          echo "STAGE: Gradle Release Build"
          echo "========================================"
          echo "STARTING ANDROID RELEASE APK BUILD"
          echo "========================================"
          if [ -z "$RELEASE_STORE_FILE" ]; then
            echo "::error::RELEASE_STORE_FILE is not set - cannot build production release"
            exit 1
          fi
          
          # Sanitize distribution URL to guarantee private R2 S3/API endpoints are NEVER passed to the Android app
          DIST_URL="${RAW_DIST_URL:-https://swayog-dashboard.vercel.app}"
          if [[ "$DIST_URL" == *".r2.cloudflarestorage.com"* ]] || [[ "$DIST_URL" == *"your-public-domain.com"* ]] || [ -z "$DIST_URL" ]; then
            echo "Notice: Overriding private/invalid distribution URL '$DIST_URL' with 'https://swayog-dashboard.vercel.app'"
            DIST_URL="https://swayog-dashboard.vercel.app"
          fi
          export PUBLIC_DISTRIBUTION_URL="$DIST_URL"

          # Clean any local or machine-specific java.home settings from all possible properties locations
          sed -i '/org\.gradle\.java\.home/d' gradle.properties 2>/dev/null || true
          sed -i '/org\.gradle\.java\.home/d' ../gradle.properties 2>/dev/null || true
          mkdir -p ~/.gradle && sed -i '/org\.gradle\.java\.home/d' ~/.gradle/gradle.properties 2>/dev/null || true
          
          ./gradlew :app:assembleRelease \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            -PversionName="${{ steps.versioning.outputs.VERSION_NAME }}" \
            -PversionCode="${{ steps.versioning.outputs.VERSION_CODE }}" \
            -PPUBLIC_DISTRIBUTION_URL="$DIST_URL" \
            --no-daemon --stacktrace

      - name: Verify APK Production Signing Certificate
        id: verify_apk_cert
        working-directory: android-app
        env:
          EXPECTED_CERT_SHA256: ${{ steps.signing_secrets.outputs.PRODUCTION_CERT_SHA256 }}
          REPO_CERT_SHA256: ${{ vars.PRODUCTION_CERT_SHA256 }}
        run: |
          set -Eeuo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          echo "Verifying APK signing certificate..."

          if command -v apksigner &> /dev/null; then
            APKSIGNER="apksigner"
          elif [ -n "${ANDROID_HOME:-}" ]; then
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          else
            APKSIGNER="apksigner"
          fi

          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found."
            exit 1
          fi

          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK" 2>&1)"

          echo "$CERT_OUTPUT"

          ACTUAL_CERT_SHA256="$(
            printf '%s\n' "$CERT_OUTPUT" |
            sed -nE 's/.*certificate SHA-256 digest:[[:space:]]*([0-9A-Fa-f:]+).*/\1/p' |
            head -n 1 |
            tr -d ':'
          )"

          ACTUAL_CERT_SHA256="$(printf '%s' "$ACTUAL_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          EXPECTED_CERT_SHA256="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"

          echo "Expected certificate: $EXPECTED_CERT_SHA256"
          echo "APK certificate:      $ACTUAL_CERT_SHA256"

          if [ -z "$ACTUAL_CERT_SHA256" ]; then
            echo "::error::Could not extract APK signing certificate."
            exit 1
          fi

          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::CRITICAL: APK signing certificate does not match production keystore."
            exit 1
          fi

          if [ -n "${REPO_CERT_SHA256:-}" ]; then
            CLEAN_REPO_CERT="${REPO_CERT_SHA256//:/}"
            CLEAN_REPO_CERT="$(echo "$CLEAN_REPO_CERT" | tr -d ' ' | tr '[:upper:]' '[:lower:]')"
            if [ "$ACTUAL_CERT_SHA256" != "$CLEAN_REPO_CERT" ]; then
              echo "::error::CRITICAL: APK signing certificate does not match repository variable PRODUCTION_CERT_SHA256."
              exit 1
            fi
            echo "APK certificate matches repository variable PRODUCTION_CERT_SHA256."
          fi

          echo "APK_CERT_SHA256=$ACTUAL_CERT_SHA256" >> "$GITHUB_OUTPUT"
          echo "APK signing certificate verified successfully."

      - name: Verify Built APK & Calculate SHA-256
        id: apk_info
        run: |
          APK_PATH="android-app/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Release APK not found after assembleRelease!"
            exit 1
          fi

          if [[ "$APK_PATH" == *"debug"* ]]; then
            echo "::error::APK appears to be a debug build, not release"
            exit 1
          fi

          SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          FILE_SIZE=$(stat -c%s "$APK_PATH")

          echo "Found APK: $APK_PATH ($FILE_SIZE bytes)"
          echo "SHA-256:  $SHA256"

          echo "APK_PATH=$APK_PATH" >> $GITHUB_OUTPUT
          echo "SHA256=$SHA256" >> $GITHUB_OUTPUT
          echo "FILE_SIZE=$FILE_SIZE" >> $GITHUB_OUTPUT

      - name: Strict APK Signature and Metadata Validation
        env:
          APK_PATH: ${{ steps.apk_info.outputs.APK_PATH }}
          EXPECTED_VERSION_CODE: ${{ steps.versioning.outputs.VERSION_CODE }}
          EXPECTED_VERSION_NAME: ${{ steps.versioning.outputs.VERSION_NAME }}
          EXPECTED_CERT_SHA256: ${{ steps.signing_secrets.outputs.PRODUCTION_CERT_SHA256 }}
        run: |
          set -Eeuo pipefail
          echo "========================================"
          echo "STAGE: APK_VALIDATION"
          echo "========================================"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::FAILED STAGE: APK_VALIDATION"
            echo "::error::APK file does not exist: $APK_PATH"
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::FAILED STAGE: APK_VALIDATION"
            echo "::error::APK file is empty: $APK_PATH"
            exit 1
          fi

          if command -v apksigner &> /dev/null; then
            APKSIGNER="apksigner"
          elif [ -n "$ANDROID_HOME" ]; then
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          fi

          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::FAILED STAGE: APK signing"
            echo "::error::apksigner was not found; the APK certificate cannot be verified."
            exit 1
          fi
          
          if command -v aapt2 &> /dev/null; then
            AAPT2="aapt2"
          elif [ -n "$ANDROID_HOME" ]; then
            AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)
          fi

          if [ -z "$AAPT2" ] || [ ! -x "$AAPT2" ]; then
            echo "::error::FAILED STAGE: APK metadata validation"
            echo "::error::aapt2 was not found; package and versionCode cannot be verified."
            exit 1
          fi

          echo "Using apksigner: $APKSIGNER"
          echo "Using aapt2:     $AAPT2"

          echo "Verifying cryptographic APK signature..."
          if ! CERT_INFO=$($APKSIGNER verify --verbose --print-certs "$APK_PATH" 2>&1); then
            echo "$CERT_INFO"
            echo "::error::FAILED STAGE: APK signing"
            echo "::error::APK signature verification failed"
            exit 1
          fi

          if ! unzip -t "$APK_PATH" >/dev/null; then
            echo "::error::FAILED STAGE: APK_VALIDATION"
            echo "::error::APK archive is not structurally readable."
            exit 1
          fi
          if ! unzip -l "$APK_PATH" | grep -q '^.*AndroidManifest\.xml$'; then
            echo "::error::FAILED STAGE: APK_VALIDATION"
            echo "::error::APK does not contain AndroidManifest.xml."
            exit 1
          fi

          CLEAN_EXPECTED=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          CLEAN_ACTUAL=$(printf '%s\n' "$CERT_INFO" | sed -nE 's/.*certificate SHA-256 digest:[[:space:]]*([0-9A-Fa-f:]+).*/\1/p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          if [ -z "$CLEAN_ACTUAL" ]; then
            echo "::error::FAILED STAGE: APK signing certificate"
            echo "::error::APK signing certificate could not be extracted."
            exit 1
          fi
          echo "APK signing certificate SHA-256: $CLEAN_ACTUAL"

          if [ "$CLEAN_ACTUAL" != "$CLEAN_EXPECTED" ]; then
            echo "::error::FAILED STAGE: APK signing certificate"
            echo "::error::APK certificate does not match the production keystore certificate."
            exit 1
          fi
          echo "Production and APK certificates match"

          if ! DUMP_OUTPUT=$($AAPT2 dump badging "$APK_PATH" 2>&1); then
            echo "$DUMP_OUTPUT"
            echo "::error::FAILED STAGE: APK_VALIDATION"
            echo "::error::aapt2 could not read APK metadata."
            exit 1
          fi
            
            if ! echo "$DUMP_OUTPUT" | grep -q "package: name='com.swayog.employee'"; then
              echo "::error::APK package name is not 'com.swayog.employee'!"
              exit 1
            fi
            echo "✅ Package name confirmed: com.swayog.employee"

            if ! echo "$DUMP_OUTPUT" | grep -q "versionCode='$EXPECTED_VERSION_CODE'"; then
              echo "::error::APK versionCode does not match expected build number $EXPECTED_VERSION_CODE!"
              exit 1
            fi
            echo "✅ Version code confirmed: $EXPECTED_VERSION_CODE"

            if ! echo "$DUMP_OUTPUT" | grep -q "versionName='$EXPECTED_VERSION_NAME'"; then
              echo "::error::APK versionName does not match expected version name $EXPECTED_VERSION_NAME!"
              exit 1
            fi
            echo "✅ Version name confirmed: $EXPECTED_VERSION_NAME"

          if [ "$EXPECTED_VERSION_CODE" -lt 1 ]; then
            echo "::error::Production release versionCode must be >= 1 (got: $EXPECTED_VERSION_CODE)"
            exit 1
          fi

          echo "✅ APK integrity checks passed completely"

      - name: Display User-Facing Release Notes
        run: |
          echo "=== Release Notes ==="
          if [ -f release_notes.txt ]; then
            cat release_notes.txt
          elif [ -f "$GITHUB_WORKSPACE/release_notes.txt" ]; then
            cp "$GITHUB_WORKSPACE/release_notes.txt" ./release_notes.txt
            cat release_notes.txt
          fi

      - name: Pre-Deploy Environment Diagnostics
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          echo "========================================"
          echo "STAGE: Pre-Deploy Environment Check"
          echo "========================================"
          echo "R2_ENDPOINT:          ${R2_ENDPOINT:+PRESENT}"
          echo "R2_ACCESS_KEY_ID:     ${R2_ACCESS_KEY_ID:+PRESENT}"
          echo "R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:+PRESENT}"
          echo "R2_BUCKET_NAME:       ${R2_BUCKET_NAME:+PRESENT} (uses default 'swayog-dashboard' if absent)"
          echo "R2_PUBLIC_URL:        ${R2_PUBLIC_URL:+PRESENT}"
          MISSING=""
          [ -z "${R2_ENDPOINT:-}" ]          && MISSING="$MISSING R2_ENDPOINT"
          [ -z "${R2_ACCESS_KEY_ID:-}" ]     && MISSING="$MISSING R2_ACCESS_KEY_ID"
          [ -z "${R2_SECRET_ACCESS_KEY:-}" ] && MISSING="$MISSING R2_SECRET_ACCESS_KEY"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required R2 secrets:$MISSING"
            echo "::error::Configure them under: GitHub repo → Settings → Secrets and variables → Actions → Secrets"
            exit 1
          fi
          echo "All required R2 secrets are present."

      - name: Publish APK & Canonical latest.json to Cloudflare R2
        working-directory: backend
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'swayog-dashboard' }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          PUBLIC_DISTRIBUTION_URL: ${{ secrets.PUBLIC_DISTRIBUTION_URL }}
          WEB_DOMAIN: ${{ secrets.WEB_DOMAIN || 'https://swayog-dashboard.vercel.app' }}
          PRODUCTION_CERT_SHA256: ${{ steps.signing_secrets.outputs.PRODUCTION_CERT_SHA256 }}
          CERTIFICATE_SHA256: ${{ steps.verify_apk_cert.outputs.APK_CERT_SHA256 }}
        run: |
          npm ci
          npx tsx scripts/deploy-release.ts \
            "../${{ steps.apk_info.outputs.APK_PATH }}" \
            "${{ steps.versioning.outputs.VERSION_NAME }}" \
            "${{ steps.versioning.outputs.VERSION_CODE }}" \
            "${{ steps.versioning.outputs.MIN_VERSION_CODE }}" \
            "${{ steps.versioning.outputs.MANDATORY }}" \
            "../release_notes.txt" \
            "${{ steps.versioning.outputs.RELEASE_TAG }}" \
            "${{ steps.versioning.outputs.RELEASE_TITLE }}"

      - name: Validate Release in Cloudflare R2
        working-directory: backend
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'swayog-dashboard' }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          EXPECTED_VERSION_NAME: ${{ steps.versioning.outputs.VERSION_NAME }}
          EXPECTED_VERSION_CODE: ${{ steps.versioning.outputs.VERSION_CODE }}
          EXPECTED_SHA256: ${{ steps.apk_info.outputs.SHA256 }}
        run: |
          if [ -z "$R2_ENDPOINT" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "::error::R2 credentials are required for production releases! Missing R2_ENDPOINT, R2_ACCESS_KEY_ID, or R2_SECRET_ACCESS_KEY in GitHub Secrets."
            exit 1
          fi
          
          npm ci
          node -e '
          const { S3Client, GetObjectCommand } = require("@aws-sdk/client-s3");
          
          async function validate() {
            const client = new S3Client({
              region: "auto",
              endpoint: process.env.R2_ENDPOINT,
              credentials: {
                accessKeyId: process.env.R2_ACCESS_KEY_ID,
                secretAccessKey: process.env.R2_SECRET_ACCESS_KEY,
              },
            });

            console.log("Fetching latest.json from R2...");
            const res = await client.send(new GetObjectCommand({
              Bucket: process.env.R2_BUCKET_NAME,
              Key: "latest.json",
            }));

            const chunks = [];
            for await (const chunk of res.Body) chunks.push(chunk);
            const raw = Buffer.concat(chunks).toString("utf-8");
            
            const manifest = JSON.parse(raw);
            console.log("Validating manifest contract...");

            if (typeof manifest !== "object" || manifest === null) throw new Error("latest.json is not an object");
            if (manifest.appId !== "com.swayog.employee") throw new Error("appId must be com.swayog.employee");
            if (manifest.platform !== "android") throw new Error("platform must be android");
            if (!manifest.versionCode || manifest.versionCode <= 0) throw new Error("versionCode must be > 0");
            if (!manifest.versionName) throw new Error("versionName must not be empty");
            if (!manifest.apkUrl || !manifest.apkUrl.startsWith("https://")) throw new Error("apkUrl must be HTTPS: " + manifest.apkUrl);
            if (!/^[a-fA-F0-9]{64}$/.test(manifest.sha256)) throw new Error("sha256 must be 64 hex chars");
            
            if (String(manifest.versionCode) !== process.env.EXPECTED_VERSION_CODE) {
              throw new Error(`Manifest versionCode (${manifest.versionCode}) does not match expected (${process.env.EXPECTED_VERSION_CODE})`);
            }
            if (manifest.sha256.toLowerCase() !== process.env.EXPECTED_SHA256.toLowerCase()) {
              throw new Error(`Manifest sha256 does not match actual APK sha256`);
            }

            console.log("✅ All manifest validation checks passed successfully!");
          }

          validate().catch(err => {
            console.error("::error::Release Validation Failed: " + err.message);
            process.exit(1);
          });
          '

      - name: Verify Public /latest.json & APK Download Release Gate
        env:
          RAW_PUBLIC_URL: ${{ secrets.PUBLIC_DISTRIBUTION_URL || 'https://swayog-dashboard.vercel.app' }}
          EXPECTED_VERSION_CODE: ${{ steps.versioning.outputs.VERSION_CODE }}
          EXPECTED_VERSION_NAME: ${{ steps.versioning.outputs.VERSION_NAME }}
          EXPECTED_SHA256: ${{ steps.apk_info.outputs.SHA256 }}
        run: |
          set -Eeuo pipefail
          echo "========================================"
          echo "STAGE: Public /latest.json & APK Release Gate"
          echo "========================================"

          cat > /tmp/validate-public-release.js <<'NODE'
          const https = require("https");
          const http = require("http");
          const { URL } = require("url");

          let rawBase = (process.env.RAW_PUBLIC_URL || "https://swayog-dashboard.vercel.app").trim().replace(/\/$/, "");
          if (rawBase.includes(".r2.cloudflarestorage.com") || rawBase.includes("your-public-domain.com") || !rawBase) {
            console.log(`[Validation Gate] Notice: Overriding private R2/invalid domain "${rawBase}" with canonical "https://swayog-dashboard.vercel.app"`);
            rawBase = "https://swayog-dashboard.vercel.app";
          }
          const endpoint = `${rawBase}/latest.json`;
          console.log(`[Validation Gate] Verifying authoritative public endpoint: ${endpoint}`);

          function fetchWithRedirects(targetUrl, options = {}, maxRedirects = 5) {
            return new Promise((resolve, reject) => {
              if (maxRedirects < 0) return reject(new Error("Too many redirects"));
              const parsed = new URL(targetUrl);
              const client = parsed.protocol === "https:" ? https : http;

              const req = client.request(parsed, {
                method: options.method || "GET",
                headers: {
                  "User-Agent": "SwayogReleaseValidator/1.0",
                  "Cache-Control": "no-cache, no-store",
                  "Pragma": "no-cache",
                  ...(options.headers || {})
                }
              }, (res) => {
                if ([301, 302, 303, 307, 308].includes(res.statusCode) && res.headers.location) {
                  const redirectedUrl = new URL(res.headers.location, targetUrl).toString();
                  console.log(`  ↪ Following redirect (${res.statusCode}) to: ${redirectedUrl.substring(0, 100)}...`);
                  return resolve(fetchWithRedirects(redirectedUrl, options, maxRedirects - 1));
                }

                let data = "";
                res.on("data", chunk => data += chunk);
                res.on("end", () => resolve({
                  statusCode: res.statusCode,
                  headers: res.headers,
                  body: data
                }));
              });

              req.on("error", reject);
              req.setTimeout(25000, () => {
                req.destroy();
                reject(new Error("Request timed out after 25s"));
              });
              req.end();
            });
          }

          async function main() {
            const maxAttempts = 6;
            const delayMs = 5000;
            let lastError = null;

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              console.log(`\n[Attempt ${attempt}/${maxAttempts}] Testing public OTA manifest: ${endpoint}...`);
              try {
                const testUrl = `${endpoint}?t=${Date.now()}`;
                const result = await fetchWithRedirects(testUrl);

                const contentType = result.headers["content-type"] || "";
                console.log(`  Manifest HTTP Status:  ${result.statusCode}`);
                console.log(`  Manifest Content-Type: ${contentType}`);

                if (result.statusCode === 404) throw new Error(`Endpoint returned HTTP 404 Not Found at ${endpoint}`);
                if (result.statusCode === 400) throw new Error(`Endpoint returned HTTP 400 (R2 S3 API error) at ${endpoint}`);
                if (result.statusCode >= 500) throw new Error(`Endpoint returned server error HTTP ${result.statusCode} at ${endpoint}`);
                if (result.statusCode !== 200) throw new Error(`Endpoint returned unexpected HTTP ${result.statusCode} at ${endpoint}`);
                if (!contentType.toLowerCase().includes("application/json")) {
                  const preview = result.body.substring(0, 100).replace(/\r?\n/g, " ");
                  throw new Error(`Endpoint returned non-JSON Content-Type (${contentType}): ${preview}`);
                }

                let manifest;
                try {
                  manifest = JSON.parse(result.body);
                } catch (e) {
                  throw new Error(`Endpoint response is not valid JSON: ${e.message}`);
                }

                if (!manifest || typeof manifest !== "object") throw new Error("Parsed manifest is not a valid JSON object");
                if (manifest.appId !== "com.swayog.employee") throw new Error(`appId must be 'com.swayog.employee', got '${manifest.appId}'`);
                if (manifest.platform !== "android") throw new Error(`platform must be 'android', got '${manifest.platform}'`);
                if (typeof manifest.versionCode !== "number" || manifest.versionCode <= 0) {
                  throw new Error(`versionCode must be > 0, got ${manifest.versionCode}`);
                }
                if (!manifest.versionName || typeof manifest.versionName !== "string") {
                  throw new Error(`versionName must not be empty, got '${manifest.versionName}'`);
                }
                if (!manifest.apkUrl || !manifest.apkUrl.startsWith("https://")) {
                  throw new Error(`apkUrl must be HTTPS, got '${manifest.apkUrl}'`);
                }
                if (!manifest.sha256 || !/^[a-fA-F0-9]{64}$/.test(manifest.sha256)) {
                  throw new Error(`sha256 must be exactly 64 hex characters, got '${manifest.sha256}'`);
                }
                if (String(manifest.versionCode) !== process.env.EXPECTED_VERSION_CODE) {
                  throw new Error(`Manifest versionCode (${manifest.versionCode}) does not match expected (${process.env.EXPECTED_VERSION_CODE})`);
                }
                if (manifest.sha256.toLowerCase() !== process.env.EXPECTED_SHA256.toLowerCase()) {
                  throw new Error(`Manifest sha256 (${manifest.sha256}) does not match expected APK sha256 (${process.env.EXPECTED_SHA256})`);
                }

                console.log(`  ✅ Authoritative manifest validated: Version ${manifest.versionName} (Build ${manifest.versionCode})`);
                console.log(`  ✅ APK URL: ${manifest.apkUrl}`);
                console.log(`  ✅ SHA-256: ${manifest.sha256}`);

                // Step 2: Validate public APK download accessibility
                console.log(`\n  [APK Download Check] Testing public accessibility of manifest.apkUrl...`);
                const apkHead = await fetchWithRedirects(manifest.apkUrl, {
                  headers: { "Range": "bytes=0-1023" }
                });

                console.log(`  APK HTTP Status: ${apkHead.statusCode}`);
                console.log(`  APK Content-Type: ${apkHead.headers["content-type"] || "unknown"}`);
                console.log(`  APK Content-Range: ${apkHead.headers["content-range"] || "N/A"}`);

                if ([400, 401, 403, 404, 500, 502, 503, 504].includes(apkHead.statusCode)) {
                  throw new Error(`manifest.apkUrl is NOT publicly accessible: returned HTTP ${apkHead.statusCode}`);
                }

                if (apkHead.statusCode !== 200 && apkHead.statusCode !== 206) {
                  throw new Error(`manifest.apkUrl returned unexpected status HTTP ${apkHead.statusCode}`);
                }

                console.log("  ✅ APK download endpoint confirmed publicly accessible without credentials!");
                console.log("\n========================================================");
                console.log("🚀 PUBLIC RELEASE GATE PASSED COMPLETELY");
                console.log("========================================================");
                return;
              } catch (err) {
                lastError = err;
                console.warn(`  ⚠️ Attempt ${attempt} failed: ${err.message}`);
                if (attempt < maxAttempts) {
                  console.log(`  Waiting ${delayMs / 1000}s before retry...`);
                  await new Promise(r => setTimeout(r, delayMs));
                }
              }
            }

            console.error(`::error::Public Release Gate FAILED after ${maxAttempts} attempts: ${lastError?.message}`);
            process.exit(1);
          }

          main().catch(err => {
            console.error("::error::Validation script unexpected error: " + err.message);
            process.exit(1);
          });
          NODE

          node /tmp/validate-public-release.js

      - name: Automated Version Consistency Check
        env:
          TAG: ${{ steps.versioning.outputs.RELEASE_TAG }}
          V_NAME: ${{ steps.versioning.outputs.VERSION_NAME }}
          V_CODE: ${{ steps.versioning.outputs.VERSION_CODE }}
          APK_PATH: ${{ steps.apk_info.outputs.APK_PATH }}
        run: |
          set -Eeuo pipefail
          echo "========================================"
          echo "STAGE: Automated Version Consistency Check"
          echo "========================================"
          EXPECTED_TAG="v${V_NAME}-build${V_CODE}"
          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "::error::Tag inconsistency! Calculated TAG='$TAG' does not match expected format '$EXPECTED_TAG'"
            exit 1
          fi

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK was not found at $APK_PATH"
            exit 1
          fi

          echo "✅ Version Consistency Confirmed: Tag=$TAG, Version=$V_NAME, Build=$V_CODE"

      - name: Create and Push Immutable Git Release Tag
        run: |
          set -Eeuo pipefail
          RELEASE_TAG="${{ steps.versioning.outputs.RELEASE_TAG }}"
          RELEASE_TITLE="${{ steps.versioning.outputs.RELEASE_TITLE }}"
          
          echo "Verifying immutability of release tag: $RELEASE_TAG"
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release tag '$RELEASE_TAG' already exists! Production release tags are immutable and cannot be overwritten."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$RELEASE_TAG" -m "$RELEASE_TITLE"
          git push origin "$RELEASE_TAG"
          echo "✅ Created and pushed immutable Git tag: $RELEASE_TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.RELEASE_TAG }}
          name: ${{ steps.versioning.outputs.RELEASE_TITLE }}
          body_path: release_notes.txt
          files: ${{ steps.apk_info.outputs.APK_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Backup APK to Private GitHub Run Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.versioning.outputs.RELEASE_TAG }}
          path: ${{ steps.apk_info.outputs.APK_PATH }}
          retention-days: 60

      - name: Release Deployment Summary
        run: |
          echo "========================================"
          echo "Swayog Employee App Release"
          echo "========================================"
          echo "Version Name:   ${{ steps.versioning.outputs.VERSION_NAME }}"
          echo "Version Code:   ${{ steps.versioning.outputs.VERSION_CODE }}"
          echo "Release Tag:    ${{ steps.versioning.outputs.RELEASE_TAG }}"
          echo "Commit:         ${{ github.sha }}"
          echo "APK:            app-release.apk"
          echo "APK SHA-256:    ${{ steps.apk_info.outputs.SHA256 }}"
          echo "APK Size:       $(( ${{ steps.apk_info.outputs.FILE_SIZE }} / 1024 / 1024 )) MB (${{ steps.apk_info.outputs.FILE_SIZE }} bytes)"
          echo "R2 APK:         releases/android/${{ steps.versioning.outputs.VERSION_NAME }}/build-${{ steps.versioning.outputs.VERSION_CODE }}/app-release.apk"
          echo "Manifest:       latest.json"
          echo "GitHub Release: ${{ steps.versioning.outputs.RELEASE_TITLE }}"
          echo "========================================"

          echo "### 🚀 Production Release Successfully Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- **App:** Swayog Employee App" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Name:** \`v${{ steps.versioning.outputs.VERSION_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Code / Build:** \`${{ steps.versioning.outputs.VERSION_CODE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Tag:** \`${{ steps.versioning.outputs.RELEASE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Mandatory Update:** \`${{ steps.versioning.outputs.MANDATORY }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA-256 Checksum:** \`${{ steps.apk_info.outputs.SHA256 }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **File Size:** \`$(( ${{ steps.apk_info.outputs.FILE_SIZE }} / 1024 / 1024 )) MB\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Distribution Layer:** Cloudflare R2 (\`swayog-dashboard\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **Canonical Manifest:** \`latest.json\`" >> $GITHUB_STEP_SUMMARY
          echo "- **APK Storage Key:** \`releases/android/${{ steps.versioning.outputs.VERSION_NAME }}/build-${{ steps.versioning.outputs.VERSION_CODE }}/app-release.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Public Endpoint:** \`https://swayog-dashboard.vercel.app/latest.json\`" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Release:** Published with tag \`${{ steps.versioning.outputs.RELEASE_TAG }}\`" >> $GITHUB_STEP_SUMMARY


          